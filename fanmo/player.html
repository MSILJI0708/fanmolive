<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선수 기록실</title>
<script>
// lp_board.html·옵션 페이지(options.html)와 같은 localStorage 키를 공유해 테마 설정을
// 따라간다 — CSS보다 먼저 실행해야 어두운 테마 선택 시 화면이 번쩍이지 않는다.
(function() {
  try {
    var p = JSON.parse(localStorage.getItem('kboBoardPrefs_v1') || '{}');
    if (p.theme === 'light' || p.theme === 'dark') document.documentElement.setAttribute('data-theme', p.theme);
  } catch (e) {}
})();
</script>
<style>
:root {
  --paper-0: #f3f1ea; --paper-1: #ffffff; --ink-0: #1c1a15; --ink-1: #58554a;
  --line: #dcd8cc; --accent: #b9822f; --accent-ink: #6b4e1c; --hot: #b6402f;
  --cool: #3a5f9e; --chip-bg: #efe9d8; --row-alt: #ebe8de;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper-0: #14120d; --paper-1: #1c1a14; --ink-0: #ede8db; --ink-1: #a9a290;
    --line: #38352a; --accent: #d9a24d; --accent-ink: #f2cf95; --hot: #e2695a;
    --cool: #7ea3e0; --chip-bg: #262218; --row-alt: #1f1c15;
  }
}
:root[data-theme="dark"] {
  --paper-0: #14120d; --paper-1: #1c1a14; --ink-0: #ede8db; --ink-1: #a9a290;
  --line: #38352a; --accent: #d9a24d; --accent-ink: #f2cf95; --hot: #e2695a;
  --cool: #7ea3e0; --chip-bg: #262218; --row-alt: #1f1c15;
}
:root[data-theme="light"] {
  --paper-0: #f3f1ea; --paper-1: #ffffff; --ink-0: #1c1a15; --ink-1: #58554a;
  --line: #dcd8cc; --accent: #b9822f; --accent-ink: #6b4e1c; --hot: #b6402f;
  --cool: #3a5f9e; --chip-bg: #efe9d8; --row-alt: #ebe8de;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--paper-0); color: var(--ink-0);
  font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
header { padding: 18px 20px 12px; border-bottom: 1px solid var(--line); }
h1 { font-size: 18px; margin: 0 0 4px; }
h1 .team { color: var(--ink-1); font-size: 13px; font-weight: 400; margin-left: 6px; }
header p { margin: 0; color: var(--ink-1); font-size: 12px; }
main { padding: 12px 20px 32px; overflow-x: auto; }
h2 { font-size: 13px; color: var(--ink-1); margin: 18px 0 6px; }
table { border-collapse: collapse; width: 100%; min-width: 480px; font-size: 12.5px; }
thead th { text-align: right; padding: 6px 8px; border-bottom: 2px solid var(--line); color: var(--ink-1); white-space: nowrap; }
thead th.left { text-align: left; }
tbody td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody td.left { text-align: left; }
tbody tr.career { background: var(--chip-bg); font-weight: 700; }
tbody tr:hover { background: var(--row-alt); }
.empty { color: var(--ink-1); font-size: 12.5px; padding: 20px 0; }
.error { color: var(--hot); font-size: 12.5px; padding: 20px 0; }
.site-nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.site-nav a {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12.5px; font-weight: 600;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--paper-1);
  color: var(--ink-1);
  text-decoration: none;
}
.site-nav a:hover { border-color: var(--accent); color: var(--accent-ink); }
</style>
<body>
<header>
  <h1><span id="title">선수 기록실</span><span class="team" id="teamLine"></span></h1>
  <nav class="site-nav">
    <a href="index.html">← LP 보드</a>
    <a href="records.html">📊 기록실</a>
  </nav>
  <p>정규시즌(올스타·포스트시즌 제외) 기록 · 자동 집계</p>
</header>
<main>
  <h2>시즌별</h2>
  <table id="seasonTbl"><thead></thead><tbody></tbody></table>
  <h2>통산</h2>
  <table id="careerTbl"><thead></thead><tbody></tbody></table>
</main>
<script>
const params = new URLSearchParams(location.search);
const CODE = params.get('code') || '';
const ROLE = params.get('role') === 'pitchers' ? 'pitchers' : 'batters';
const FALLBACK_NAME = params.get('name') || '';

const BATTER_COLS = [
  {h:'시즌', key:'season', left:true},
  {h:'팀', key:'team', left:true},
  {h:'G', key:'G'}, {h:'AB', key:'AB'}, {h:'PA', key:'PA'},
  {h:'R', key:'R'}, {h:'H', key:'H'}, {h:'2B', key:'2B'}, {h:'3B', key:'3B'}, {h:'HR', key:'HR'},
  {h:'RBI', key:'RBI'}, {h:'BB', key:'BB'}, {h:'K', key:'K'}, {h:'SB', key:'SB'}, {h:'CS', key:'CS'},
  {h:'AVG', key:'AVG', dec:3}, {h:'OBP', key:'OBP', dec:3}, {h:'SLG', key:'SLG', dec:3}, {h:'OPS', key:'OPS', dec:3},
];
const PITCHER_COLS = [
  {h:'시즌', key:'season', left:true},
  {h:'팀', key:'team', left:true},
  {h:'G', key:'G'}, {h:'GS', key:'GS'}, {h:'IP', key:'IP'},
  {h:'W', key:'WIN'}, {h:'L', key:'LOSS'}, {h:'SV', key:'SAVE'}, {h:'HLD', key:'HOLD'}, {h:'BS', key:'BLOWN'},
  {h:'ERA', key:'ERA', dec:2}, {h:'WHIP', key:'WHIP', dec:2},
  {h:'H', key:'H'}, {h:'HR', key:'HR'}, {h:'BB', key:'BB'}, {h:'K', key:'K'}, {h:'QS', key:'QS'},
];

function renderTable(tblId, cols, rows, extraClass) {
  const tbl = document.getElementById(tblId);
  if (!rows.length) {
    tbl.outerHTML = '<p class="empty">해당 구간에 조사된 기록이 없습니다.</p>';
    return;
  }
  tbl.querySelector('thead').innerHTML = '<tr>' + cols.map(c =>
    `<th class="${c.left ? 'left' : ''}">${c.h}</th>`).join('') + '</tr>';
  tbl.querySelector('tbody').innerHTML = rows.map(r => '<tr' + (extraClass ? ` class="${extraClass}"` : '') + '>' +
    cols.map(c => {
      let v = c.key === 'season' ? (r.season || '') : r[c.key];
      if (c.key !== 'season' && c.key !== 'team' && v == null) v = 0;
      if (c.dec != null) v = Number(v).toFixed(c.dec);
      return `<td class="${c.left ? 'left' : ''}">${v ?? ''}</td>`;
    }).join('') + '</tr>').join('');
}

function findRows(seasonStats, careerStats, role) {
  const seasonRows = [];
  Object.keys(seasonStats).sort().forEach(season => {
    const list = (seasonStats[season] || {})[role] || [];
    const row = list.find(r => String(r.player_code) === String(CODE));
    if (row) seasonRows.push(Object.assign({ season }, row));
  });
  const careerList = (careerStats || {})[role] || [];
  const careerRow = careerList.find(r => String(r.player_code) === String(CODE));
  return { seasonRows, careerRow };
}

async function main() {
  if (!CODE) {
    document.getElementById('title').textContent = '선수를 찾을 수 없습니다';
    return;
  }

  let seasonStats, careerStats;
  try {
    [seasonStats, careerStats] = await Promise.all([
      fetch('season_stats.json').then(r => { if (!r.ok) throw new Error('season_stats.json HTTP ' + r.status); return r.json(); }),
      fetch('career_stats.json').then(r => { if (!r.ok) throw new Error('career_stats.json HTTP ' + r.status); return r.json(); }),
    ]);
  } catch (e) {
    // fetch 실패를 조용히 삼키면(예전엔 이랬다) 화면이 빈 채로 남아서 원인을 알 수 없다 —
    // 새로고침해보라는 안내라도 보이게 한다.
    document.querySelector('main').innerHTML =
      '<p class="error">기록을 불러오지 못했습니다(' + (e && e.message || e) + '). 새로고침해 보세요.</p>';
    return;
  }

  let role = ROLE;
  let { seasonRows, careerRow } = findRows(seasonStats, careerStats, role);
  // URL의 role이 실제와 다를 수 있다(예전 링크를 즐겨찾기해 뒀거나 한 경우) — 못 찾으면
  // 반대 role로 한 번 더 찾아본다. 타자/투수 양쪽에 다 기록이 있는 극소수 선수는 원래
  // role을 그대로 우선한다(여기까지 왔다는 건 원래 role에서 못 찾았다는 뜻).
  if (!seasonRows.length && !careerRow) {
    const otherRole = role === 'pitchers' ? 'batters' : 'pitchers';
    const alt = findRows(seasonStats, careerStats, otherRole);
    if (alt.seasonRows.length || alt.careerRow) {
      role = otherRole;
      seasonRows = alt.seasonRows;
      careerRow = alt.careerRow;
    }
  }

  const name = (careerRow && careerRow.name) || (seasonRows[0] && seasonRows[0].name) || FALLBACK_NAME || '알 수 없음';
  const teams = [...new Set(seasonRows.map(r => r.team).filter(Boolean))].join(' · ');
  document.title = name + ' 기록실';
  document.getElementById('title').textContent = name;
  document.getElementById('teamLine').textContent = teams;

  const cols = role === 'pitchers' ? PITCHER_COLS : BATTER_COLS;
  renderTable('seasonTbl', cols, seasonRows);
  renderTable('careerTbl', cols, careerRow ? [Object.assign({ season: '통산' }, careerRow)] : [], 'career');
}

main().catch(e => {
  const main = document.querySelector('main');
  if (main) main.innerHTML = '<p class="error">알 수 없는 오류가 발생했습니다: ' + (e && e.message || e) + '</p>';
});
</script>
