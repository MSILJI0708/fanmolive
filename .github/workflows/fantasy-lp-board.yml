name: KBO/MLB 판타지 LP 보드 자동 갱신

# 사람이 매번 실행하지 않아도, 정해진 주기로:
#   1) 오늘 KBO 경기(collect_date가 알아서 시작 전 경기는 건너뜀)를 수집하고
#   2) 테스트로 오늘 MLB 경기도 같이 수집해보고
#   3) 두 보드를 다시 빌드해서
#   4) 수집 데이터는 저장소에 커밋, 완성된 HTML은 GitHub Pages로 배포한다.
#
# 실행 빈도(KST 기준, cron은 UTC라 KST-9시간으로 환산했다):
#   - KST 01:00~09:00 (KBO 새벽/심야 연장 드묾, MLB 한창 진행 중) → UTC 16-23시, 5분 간격
#   - KST 18:00~24:00 (KBO 저녁 경기 시간대) → UTC 09-14시, 5분 간격
#   - 그 외 시간 → UTC 0-8,15시, 30분 간격
# 주의: 이 저장소는 private이다. private 저장소는 매달 Actions 무료 사용량이 2,000분으로
# 제한되는데, 이 스케줄대로면 하루 약 188회(5분 구간 168회 + 30분 구간 20회) 실행되고 한 번에
# 1~2분씩만 걸려도 한 달에 5,000~11,000분이 필요해 무료 한도를 크게 넘긴다. 한도를 넘으면
# 초과분이 과금되거나 워크플로우가 중단될 수 있으니, 저장소를 public으로 바꾸거나(Actions
# 사용량 무제한) 간격을 넓히는 걸 권장한다.
on:
  schedule:
    - cron: "*/5 16-23 * * *" # KST 01:00-09:00
    - cron: "*/5 9-14 * * *" # KST 18:00-24:00
    - cron: "*/30 0-8,15 * * *" # 나머지 시간
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write # 수집한 데이터/보드를 저장소에 커밋하기 위해 필요
  pages: write # GitHub Pages 배포에 필요
  id-token: write # GitHub Pages 배포(OIDC)에 필요

concurrency:
  group: fantasy-lp-board
  cancel-in-progress: false # 겹치면 취소하지 않고 순서대로(커밋 충돌 방지)

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 전부 표준 라이브러리만 쓰므로(urllib, json, ssl, http.server 등) pip install 단계가 필요 없다.

      - name: "KBO 오늘 경기 수집 (기준일: KST 오늘)"
        working-directory: fanmo
        run: |
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          echo "TODAY_KST=$TODAY_KST" >> "$GITHUB_ENV"
          python daily_pipeline.py --date "$TODAY_KST"

      - name: MLB 오늘 경기 수집 (테스트, 실패해도 KBO 파이프라인은 계속)
        working-directory: fanmo
        continue-on-error: true
        run: |
          TODAY_KST=$(TZ=Asia/Seoul date +%F)
          python mlb_fantasy_score.py --date "$TODAY_KST"

      - name: 보드 HTML 빌드
        working-directory: fanmo
        run: |
          python build_board.py --date "$TODAY_KST"
          python build_mlb_board.py --date "$TODAY_KST" || true

      - name: 수집 결과 커밋 & 푸시
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fanmo/data_*.json fanmo/position_db.json fanmo/lp_board.html fanmo/lp_board_mlb.html
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git commit -m "chore: auto-update LP board ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            git push
          fi

      - name: Pages 배포용 폴더 구성
        run: |
          mkdir -p _site
          cp fanmo/lp_board.html _site/index.html
          if [ -f fanmo/lp_board_mlb.html ]; then
            cp fanmo/lp_board_mlb.html _site/mlb.html
          fi

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages로 배포
        id: deployment
        uses: actions/deploy-pages@v4
