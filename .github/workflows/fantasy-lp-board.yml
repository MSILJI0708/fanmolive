name: KBO/MLB 판타지 LP 보드 자동 갱신

# 사람이 매번 실행하지 않아도, 정해진 주기로:
#   0) 지금이 "활성 구간"(오늘 KBO 첫 경기 시작 2시간 전 ~ 그날 경기 전부 종료)인지
#      check_active_window.py로 확인한다. KBO 활성 구간이면 수집/빌드/커밋/배포를 전부 한다.
#   0-1) MLB 수집 자체는 mlb-collect.yml이 따로 맡는다(한 사이클 235초 중 MLB가 81초를
#      차지해 KBO 갱신을 그만큼 밀어냈기 때문에 분리했다). 여기서는 그쪽이 새로 수집해
#      둔 게 있는지만 보고(mlb_last_run.txt vs mlb_last_build.txt) 보드에 반영한다.
#   1) KBO가 활성 구간이면 오늘 KBO 경기(collect_date가 알아서 시작 전 경기는 건너뜀)를 수집하고
#   2) MLB 새 수집분이 있으면 그것도 함께 반영해서
#   3) (KBO 활성 또는 MLB 새 데이터 또는 과거 백필 시점이면) 두 보드를 다시 빌드해서
#   4) 수집 데이터는 저장소에 커밋, 완성된 HTML은 GitHub Pages로 배포한다.
#
# 트리거 자체는 외부 cron-job.org가 고정 간격으로 이 워크플로우의 workflow_dispatch를
# 호출하는 방식이다(GitHub 자체 schedule: 트리거가 못 미더워서 이렇게 바꿈). cron-job.org는
# 원하는 가장 빠른 주기(예: 1~2분)로 항상 호출하게 해두고, 실제로 뭘 할지는 위 0/0-1번
# 판정으로 매번 정한다. public 저장소라 Actions 무료 사용량 제한이 없어서, 자주 호출해도
# 문제없다(둘 다 아닐 때는 몇 초 안에 끝나서 비용도 거의 없음).
on:
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write # 수집한 데이터/보드를 저장소에 커밋하기 위해 필요
  pages: write # GitHub Pages 배포에 필요
  id-token: write # GitHub Pages 배포(OIDC)에 필요

concurrency:
  group: fantasy-lp-board
  cancel-in-progress: false # 겹치면 취소하지 않고 순서대로(커밋 충돌 방지)

jobs:
  collect-and-build:
    runs-on: ubuntu-latest
    # cron-job.org가 몇 분 간격으로 계속 호출하는데, 네이버 API가 (특히 라이브 경기 중)
    # 느려지면 한 번의 실행이 오래 걸릴 수 있다. cancel-in-progress: false라 뒤에 쌓인
    # 실행들이 이 실행 하나가 끝날 때까지 전부 대기하므로, 여기서 상한을 걸어두지 않으면
    # 실행 하나가 몇 시간이고 멈춰 있으면서 뒤의 모든 갱신을 막아버릴 수 있다(실제로 발생함
    # — 09:06 실행이 20분 넘게 멈춰서 그 뒤 실행들이 전부 대기하다 취소됨). 정상적인 실행은
    # 몇 분이면 끝나므로 여유 있게 잡아도 충분하다.
    timeout-minutes: 13 # 2008~2022년 과거 백필 단계(최대 3분, 10분 간격 스로틀)가 겹칠 때를 감안해 여유를 늘림
    outputs:
      do_work: ${{ steps.combine.outputs.do_work }}
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 전부 표준 라이브러리만 쓰므로(urllib, json, ssl, http.server 등) pip install 단계가 필요 없다.

      - name: 기준 날짜(KST) 계산
        run: |
          echo "TODAY_KST=$(TZ=Asia/Seoul date +%F)" >> "$GITHUB_ENV"
          echo "TOMORROW_KST=$(TZ=Asia/Seoul date -d '+1 day' +%F)" >> "$GITHUB_ENV"

      - name: "KBO 활성 구간인지 확인"
        id: check_active
        working-directory: fanmo
        timeout-minutes: 2
        run: |
          RESULT=$(python check_active_window.py)
          echo "active=$RESULT" >> "$GITHUB_OUTPUT"
          echo "KBO 활성 구간 판정: $RESULT"

      - name: "MLB 데이터가 새로 들어왔는지 확인 (보드를 다시 빌드할지 판단)"
        id: check_mlb_due
        working-directory: fanmo
        run: |
          # MLB 수집 자체는 mlb-collect.yml이 따로 하고 커밋만 남긴다. 그 데이터를 보드에
          # 반영하는 건 이 워크플로우 몫이라, "마지막으로 빌드한 MLB 수집 시각"과 현재
          # mlb_last_run.txt를 비교해서 새 데이터가 있을 때만 빌드한다. 경과 시간으로
          # 판단하면 방금 수집이 끝난 직후가 오히려 false가 되어 반영이 한 주기 밀린다.
          LAST_RUN=$(cat mlb_last_run.txt 2>/dev/null || echo 0)
          LAST_BUILT=$(cat mlb_last_build.txt 2>/dev/null || echo 0)
          if [ "$LAST_RUN" != "$LAST_BUILT" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
          echo "MLB 수집 시각 $LAST_RUN / 마지막 빌드 $LAST_BUILT -> due=$([ "$LAST_RUN" != "$LAST_BUILT" ] && echo true || echo false)"

      - name: "과거(2008~2022) 백필 실행 시점인지 확인 (마지막 실행 후 10분 경과)"
        id: check_historical_due
        working-directory: fanmo
        run: |
          FILE="historical_last_run.txt"
          NOW=$(date -u +%s)
          LAST=$(cat "$FILE" 2>/dev/null || echo 0)
          ELAPSED_MIN=$(( (NOW - LAST) / 60 ))
          if [ "$ELAPSED_MIN" -ge 10 ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          else
            echo "due=false" >> "$GITHUB_OUTPUT"
          fi
          echo "과거 백필 마지막 실행으로부터 ${ELAPSED_MIN}분 경과 -> due=$([ "$ELAPSED_MIN" -ge 10 ] && echo true || echo false)"

      - name: "이번에 뭐라도 할 게 있는지 종합 판정"
        id: combine
        run: |
          if [ "${{ steps.check_active.outputs.active }}" = "true" ] || [ "${{ steps.check_mlb_due.outputs.due }}" = "true" ] || [ "${{ steps.check_historical_due.outputs.due }}" = "true" ]; then
            echo "do_work=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_work=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "KBO 오늘 경기 수집 (기준일: KST 오늘)"
        if: steps.check_active.outputs.active == 'true'
        working-directory: fanmo
        timeout-minutes: 6
        run: python daily_pipeline.py --date "$TODAY_KST"

      # MLB 수집은 mlb-collect.yml로 분리했다. 한 사이클 235초 중 MLB가 81초(35%)를
      # 차지하는데 KBO 수집은 9초뿐이라, 같이 묶여 직렬로 돌면 KBO 갱신이 그만큼 밀렸다.
      # 이제 MLB는 별도 concurrency 그룹에서 병렬로 수집·커밋만 하고, 보드 빌드와 Pages
      # 배포는 여기서 계속 맡는다(Pages는 사이트를 통째로 올리는 방식이라 배포 주체가
      # 둘이면 서로 덮어쓴다). 그래서 아래 "보드 HTML 빌드"는 MLB 보드도 함께 만든다.

      - name: "2001~2022년 과거 데이터 백필 (10분 주기, 한 번에 할 수 있는 만큼만)"
        if: steps.check_historical_due.outputs.due == 'true'
        working-directory: fanmo
        continue-on-error: true
        timeout-minutes: 4
        run: |
          # 2008~2022년(네이버 API)과 2001~2007년(KBO 공식 사이트, 로그인 없이 가능한 구간)을
          # 한 회차 시간 예산을 나눠서 같이 진행한다 — 2001~2007년 쪽이 한 번 호출로 한 달치
          # 일정을 다 가져올 수 있어 훨씬 빨리 끝나므로, 먼저 다 끝내놓고 2008~2022년은
          # 오래 걸리는 대로 계속 이어간다.
          python historical_backfill_step.py
          python kbo_2001_2007_backfill_step.py
          date -u +%s > historical_last_run.txt

      - name: 보드 HTML 빌드
        if: steps.combine.outputs.do_work == 'true'
        working-directory: fanmo
        run: |
          python build_board.py --date "$TODAY_KST"
          python build_mlb_board.py --date "$TODAY_KST" || true
          # 어느 시점의 MLB 수집분까지 보드에 반영했는지 기록해 둔다(위 check_mlb_due 참고).
          cp -f mlb_last_run.txt mlb_last_build.txt 2>/dev/null || true

      - name: "시즌·통산 기록실 갱신 (KBO 데이터가 실제로 바뀌었을 때만)"
        if: steps.check_active.outputs.active == 'true' || steps.check_historical_due.outputs.due == 'true'
        working-directory: fanmo
        run: |
          python build_jersey_numbers.py
          python build_stats.py
          python build_records_board.py
          python build_player_pages.py

      - name: "데이터 정합성·자체판정 정확도 점검 (KBO 데이터가 실제로 바뀌었을 때만)"
        if: steps.check_active.outputs.active == 'true'
        working-directory: fanmo
        run: python detect_errors.py

      - name: 수집 결과 커밋 & 푸시
        if: steps.combine.outputs.do_work == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fanmo/data fanmo/data_mlb_*.json fanmo/mlb_last_build.txt fanmo/position_db.json fanmo/lp_board.html fanmo/lp_board_mlb.html fanmo/mlb_last_run.txt fanmo/position_last_refresh.txt fanmo/season_stats.json fanmo/career_stats.json fanmo/records.html fanmo/active_window_state.json fanmo/self_pred_mismatches.json fanmo/error_report.json fanmo/player fanmo/options.html fanmo/jersey_numbers.json fanmo/jersey_last_refresh.txt fanmo/season_calendar.json fanmo/historical_last_run.txt fanmo/kbo_official_calendar.json fanmo/kbo_player_code_cache.json fanmo/kbo_2001_2007_unresolved_players.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
          else
            git commit -m "chore: auto-update LP board ($(date -u +'%Y-%m-%dT%H:%MZ'))"
            # 실행 하나가 2~5분 걸리는데 그 사이 사람이 저장소에 푸시하면, 이 실행이
            # 체크아웃한 커밋이 뒤처져서 push가 non-fast-forward로 거부된다(실측: 실패
            # 10건이 전부 사람이 작업하던 시간대에 몰려 있었다. 워크플로우끼리는
            # concurrency로 이미 직렬화되어 서로 겹치지 않는다).
            # 여기서 커밋하는 건 전부 수집/생성물이라 "원격 최신 위에 다시 얹기"가
            # 그대로 성립하므로, rebase 후 재시도하면 안전하게 해결된다.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              echo "push 거부됨($attempt/3) — 그 사이 원격이 바뀐 것 같다. rebase 후 재시도"
              git pull --rebase origin main || exit 1
            done
          fi

      - name: Pages 배포용 폴더 구성
        if: steps.combine.outputs.do_work == 'true'
        run: |
          mkdir -p _site
          cp fanmo/lp_board.html _site/index.html
          if [ -f fanmo/lp_board_mlb.html ]; then
            cp fanmo/lp_board_mlb.html _site/mlb.html
          fi
          if [ -f fanmo/records.html ]; then
            cp fanmo/records.html _site/records.html
          fi
          if [ -f fanmo/options.html ]; then
            cp fanmo/options.html _site/options.html
          fi
          # player.html(선수 개별 기록 팝업 창)은 season_stats.json/career_stats.json을
          # fetch로 직접 읽으므로, records.html처럼 데이터를 내장하지 않는 대신 이 두
          # JSON을 배포 폴더에도 그대로 복사해 둬야 한다.
          if [ -f fanmo/player.html ]; then
            cp fanmo/player.html _site/player.html
            cp fanmo/season_stats.json _site/season_stats.json 2>/dev/null || true
            cp fanmo/career_stats.json _site/career_stats.json 2>/dev/null || true
          fi
          # 선수 이름으로 바로 들어가는 예쁜 URL(예: /player/강백호/) — build_player_pages.py가
          # 만든 player/<이름>/index.html 트리를 그대로 배포 폴더에 옮긴다.
          if [ -d fanmo/player ]; then
            cp -r fanmo/player _site/player
          fi
          # 등번호(동명이인 구분용) — lp_board.html이 fetch로 직접 읽는다.
          if [ -f fanmo/jersey_numbers.json ]; then
            cp fanmo/jersey_numbers.json _site/jersey_numbers.json
          fi
          # KBO 보드는 날짜별 JSON을 지연 로딩(fetch)하므로, 배포 폴더에도 개별 날짜 파일을
          # 그대로 복사해 둬야 달력에서 다른 날짜를 고를 때 fetch가 실제로 성공한다.
          # 저장소 안에서는 fanmo/data/<연도>/data_YYYYMMDD.json 로 정리돼 있지만
          # (fanmo/data_paths.py 참고), 배포 폴더에는 lp_board.html의 클라이언트 JS가
          # 그대로 'data_YYYYMMDD.json'을 fetch하므로 연도 폴더 없이 평평하게 복사한다.
          find fanmo/data -maxdepth 2 -name 'data_????????.json' -exec cp {} _site/ \; 2>/dev/null || true

      - name: Pages 아티팩트 업로드
        if: steps.combine.outputs.do_work == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect-and-build
    if: needs.collect-and-build.outputs.do_work == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages로 배포
        id: deployment
        uses: actions/deploy-pages@v4
