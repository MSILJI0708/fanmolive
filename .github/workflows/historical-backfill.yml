name: KBO 2008~2022년 과거 데이터 백그라운드 수집 (수동/테스트용)

# 원래 여기서 GitHub 자체 schedule: 트리거(30분 주기)로 historical_backfill_step.py를
# 계속 호출하려고 했으나, 이 저장소는 메인 파이프라인(fantasy-lp-board.yml)이 cron-job.org에
# 의해 몇 분 간격으로 끊임없이 호출되고 있어 Actions 사용량이 이미 매우 많다(총 실행
# 22,000회 이상). 이런 상태에서는 GitHub 자체 schedule 트리거가 큐에서 계속 밀려서 사실상
# 전혀 실행되지 않는 걸 확인했다(워크플로우 등록 후 2시간 넘게 실행 기록 0건) — 메인
# 파이프라인이 예전에 똑같은 이유로 자체 schedule을 버리고 cron-job.org로 옮겨간 것과
# 같은 문제. 그래서 실제 자동 실행은 fantasy-lp-board.yml 안에 스로틀 걸린 단계로 얹어서
# 이미 검증된 외부 트리거(cron-job.org)에 편승시켰다. 이 워크플로우는 필요할 때 수동으로
# 큰 배치를 한 번에 돌려보는 용도로만 남겨둔다.
on:
  workflow_dispatch: {} # Actions 탭에서 수동 실행/테스트용

permissions:
  contents: write

concurrency:
  group: historical-backfill
  cancel-in-progress: false

jobs:
  backfill-step:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이번 회차 백필 실행 (시간 예산 안에서 할 수 있는 만큼)
        working-directory: fanmo
        timeout-minutes: 8
        run: python historical_backfill_step.py

      - name: 결과 커밋 & 푸시 (메인 파이프라인과 동시에 돌아도 충돌 안 나게 재시도)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fanmo/season_calendar.json fanmo/data
          if git diff --cached --quiet; then
            echo "변경 사항 없음, 커밋 생략"
            exit 0
          fi
          git commit -m "chore: 2008~2022년 과거 데이터 백필 진행 ($(date -u +'%Y-%m-%dT%H:%MZ'))"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push 실패, rebase 후 재시도 ($i)"
            git fetch origin
            git rebase origin/main || { git rebase --abort; git pull --no-rebase origin main --no-edit; }
          done
          git push
